[project]
name = "ad-risk-control-system"
version = "1.0.0"
description = "A rule-based advertisement risk scoring API using FastAPI and SQLite."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

